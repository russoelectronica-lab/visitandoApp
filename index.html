<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda de Médicos</title>
<meta name="description" content="Agenda de bolsillo para visitadores médicos: médicos, visitas, notas y pendientes. Funciona sin internet.">
<meta name="theme-color" content="#0b6b66">
<link rel="icon" href="icon-192.png" type="image/png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna tipo agenda de bolsillo; lista densa arriba, ficha del médico como hoja completa encima. */
:root {
  --paper: #eef2f1;
  --card: #ffffff;
  --ink: #15242a;
  --muted: #5a6b71;
  --line: #d7dfde;
  --accent: #0b6b66;
  --accent-ink: #ffffff;
  --soft: #dcecea;
  --warn: #a8500c;
  --warn-soft: #fbecd9;
  --bday: #a8355a;
  --bday-soft: #f8e1e9;
  --danger: #b3261e;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1618; --card: #162124; --ink: #e4edeb; --muted: #93a6a7; --line: #263639;
    --accent: #52bdb2; --accent-ink: #052220; --soft: #17332f; --warn: #f0a75a; --warn-soft: #3a2814;
    --bday: #f28fae; --bday-soft: #3d1c28; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1618; --card: #162124; --ink: #e4edeb; --muted: #93a6a7; --line: #263639;
  --accent: #52bdb2; --accent-ink: #052220; --soft: #17332f; --warn: #f0a75a; --warn-soft: #3a2814;
  --bday: #f28fae; --bday-soft: #3d1c28; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 1.45rem; letter-spacing: -0.01em; text-wrap: balance; }
.brand h1 small { font-family: var(--f-body); font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-left: 6px; }
.brand-actions { display: flex; gap: 8px; }
.search { position: relative; }
.search input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); font-size: 1rem; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters select, .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 0.9rem; }
.filters select { padding-right: 28px; max-width: 46vw; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Botones */
.btn { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 9px 14px; font-weight: 700; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 0.85rem; }
.btn[data-armed="1"] { background: var(--danger); color: var(--card); border-color: var(--danger); }

/* Resumen */
.summary { display: grid; gap: 8px; margin-block: 14px 6px; }
.alert { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r); font-size: 0.92rem; }
.alert.bday { background: var(--bday-soft); }
.alert.pend { background: var(--warn-soft); }
.alert strong { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
.alert.bday strong { color: var(--bday); }
.alert.pend strong { color: var(--warn); }
.linkish { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.demo-note { font-size: 0.85rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Lista */
.count { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.count select { border: 0; background: transparent; color: var(--muted); font-size: 0.8rem; text-transform: none; letter-spacing: 0; }
.list { list-style: none; margin: 0 0 120px; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.row { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; background: none; border: 0; text-align: left; }
.row:active { background: var(--soft); }
.row-main { min-width: 0; }
.row-name { font-weight: 700; font-size: 1.02rem; }
.row-sub, .row-addr { color: var(--muted); font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.mat { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.row-badges { grid-column: 1 / -1; justify-content: flex-start; margin-top: 4px; }
.pill { font-size: 0.74rem; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.old { background: var(--warn-soft); color: var(--warn); }
.pill.bday { background: var(--bday-soft); color: var(--bday); }
.pill.pend { background: var(--warn-soft); color: var(--warn); }
.pill.demo { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.fab { position: fixed; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 6; box-shadow: 0 6px 18px rgba(0,0,0,.18); border-radius: 999px; padding: 13px 20px; }

/* Hojas (ficha, editor, respaldo) */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .bar { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); }
.sheet .bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px; }
.sheet-body { padding-block: 16px 60px; display: grid; gap: 18px; }
.eyebrow { margin: 0; font-size: 0.78rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.eyebrow .mat { font-size: 0.8rem; letter-spacing: 0; text-transform: none; }
.det-name { margin: 2px 0 8px; font-family: var(--f-display); font-size: 1.75rem; line-height: 1.15; text-wrap: balance; }
.block { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.block h3 { margin: 0; font-size: 0.78rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
dl.datos { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; }
dl.datos dt { color: var(--muted); font-size: 0.88rem; }
dl.datos dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dl.datos a { color: var(--accent); }
.comment { white-space: pre-wrap; margin: 0; }

/* Anotador */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 7px 14px; font-weight: 700; font-size: 0.9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.composer-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
textarea, .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 10px 12px; font-size: 1rem; }
textarea { min-height: 80px; resize: vertical; }
input[type="date"] { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 7px 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.check input { width: 20px; height: 20px; accent-color: var(--warn); }

/* Historial */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.timeline li:first-child { border-top: 0; }
.t-date { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.t-kind { display: block; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
.t-kind.visita { color: var(--accent); }
.t-kind.nota { color: var(--muted); }
.t-text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.t-text.done { text-decoration: line-through; color: var(--muted); }
.t-actions { display: flex; gap: 2px; align-items: center; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 6px; color: var(--muted); font-size: 0.82rem; }
.icon-btn[data-armed="1"] { color: var(--danger); font-weight: 700; }
.pend-item { display: flex; gap: 10px; align-items: flex-start; }
.pend-item input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 auto; }
.pend-item small { color: var(--muted); display: block; font-size: 0.8rem; }

/* Formulario */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.hint { font-size: 0.85rem; color: var(--muted); margin: 0; }
code { font-family: var(--f-mono); font-size: 0.82rem; background: var(--soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; z-index: 50; font-size: 0.92rem; max-width: calc(100vw - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .sheet:not([hidden]) { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateY(14px); opacity: .6; } } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Mis médicos <small id="total"></small></h1>
      <div class="brand-actions">
        <button class="btn sm" data-act="respaldo" type="button">Respaldo</button>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Buscar nombre, matrícula, calle…" autocomplete="off" aria-label="Buscar">
    </div>
    <div class="filters" role="group" aria-label="Filtros">
      <select id="f-esp" aria-label="Especialidad"></select>
      <select id="f-ciudad" aria-label="Ciudad"></select>
      <button class="chip" type="button" data-flag="pend" aria-pressed="false">Con pendientes</button>
      <button class="chip" type="button" data-flag="sinver" aria-pressed="false">Sin visitar +30 días</button>
      <button class="chip" type="button" data-flag="cumple" aria-pressed="false">Cumple este mes</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="summary" class="summary"></div>
  <div class="count"><span id="count"></span>
    <select id="orden" aria-label="Ordenar">
      <option value="nombre">Ordenar por nombre</option>
      <option value="visita">Hace más que no lo veo</option>
      <option value="ciudad">Por ciudad</option>
    </select>
  </div>
  <ul id="list" class="list"></ul>
</main>

<button class="btn primary fab" type="button" data-act="nuevo">+ Médico</button>

<section id="detalle" class="sheet" hidden aria-label="Ficha del médico"></section>
<section id="editor" class="sheet" hidden aria-label="Editar médico"></section>
<section id="ajustes" class="sheet" hidden aria-label="Respaldo"></section>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function () {
  "use strict";
  var KEY = "agenda-medicos-v1";
  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var MESES_L = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  var CAMPOS = ["nombre", "especialidad", "matricula", "telefono", "email", "direccion", "ciudad", "horarios", "cumple", "comentario"];

  /* ---------- utilidades ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hoy() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function hoyISO() { return iso(hoy()); }
  function parseISO(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function haceDias(n) { var d = hoy(); d.setDate(d.getDate() - n); return iso(d); }
  function diasDesde(s) { return Math.round((hoy() - parseISO(s)) / 864e5); }
  function fmtFecha(s) { var d = parseISO(s); return d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear(); }
  function fmtCumple(mmdd) { if (!mmdd) return ""; var p = mmdd.split("-"); return (+p[1]) + " de " + MESES_L[+p[0] - 1]; }
  function cumpleEn(n) { var d = hoy(); d.setDate(d.getDate() + n); return pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function diasACumple(mmdd) {
    if (!mmdd) return null;
    var p = mmdd.split("-"), h = hoy();
    var d = new Date(h.getFullYear(), +p[0] - 1, +p[1]);
    if (d < h) d = new Date(h.getFullYear() + 1, +p[0] - 1, +p[1]);
    return Math.round((d - h) / 864e5);
  }
  function hace(n) { if (n <= 0) return "hoy"; if (n === 1) return "ayer"; if (n < 60) return "hace " + n + " d"; return "hace " + Math.round(n / 30) + " meses"; }

  /* ---------- datos ---------- */
  function ejemplos() {
    function m(o) { o.id = uid(); o.ejemplo = true; o.notas = (o.notas || []).map(function (n) { n.id = uid(); return n; }); return o; }
    return [
      m({ nombre: "Dra. María Laura Benítez", especialidad: "Cardiología", matricula: "MP 14872", telefono: "341 555-0142", email: "", direccion: "Bv. Oroño 1340, 2° B", ciudad: "Rosario", horarios: "Lunes y miércoles de 14 a 19 h", cumple: cumpleEn(5), comentario: "Atiende por orden de llegada. Conviene llegar antes de las 15.",
        notas: [{ tipo: "visita", fecha: haceDias(9), texto: "Le dejé muestras del antihipertensivo nuevo. Pidió folletos para pacientes.", pendiente: false },
                { tipo: "nota", fecha: haceDias(9), texto: "Llevarle 2 cajas de muestras de losartán 50 mg.", pendiente: true, hecho: false }] }),
      m({ nombre: "Dr. Gustavo Ferraro", especialidad: "Clínica médica", matricula: "MP 9921", telefono: "341 555-0187", direccion: "Hipólito Yrigoyen 2050", ciudad: "Funes", horarios: "Martes y jueves de 9 a 13 h", cumple: cumpleEn(73), comentario: "Prefiere que lo visiten después de las 12.",
        notas: [{ tipo: "visita", fecha: haceDias(41), texto: "Charla corta, estaba con mucha gente.", pendiente: false }] }),
      m({ nombre: "Dra. Paula Sosa", especialidad: "Pediatría", matricula: "MP 17330", telefono: "", direccion: "Pellegrini 2950, consultorio 4", ciudad: "Rosario", horarios: "Lunes a viernes de 8 a 12 h", cumple: cumpleEn(160), comentario: "",
        notas: [{ tipo: "visita", fecha: haceDias(3), texto: "Arreglé por teléfono: va a recetar el jarabe para la tos este invierno.", pendiente: false }] }),
      m({ nombre: "Dr. Hernán Quiroga", especialidad: "Traumatología", matricula: "MP 11207", telefono: "341 555-0110", direccion: "San Martín 845", ciudad: "Villa Gobernador Gálvez", horarios: "Viernes de 16 a 20 h", cumple: cumpleEn(24), comentario: "Todavía no lo visité. Me lo pasó la Dra. Sosa.", notas: [] }),
      m({ nombre: "Dra. Silvina Acosta", especialidad: "Ginecología", matricula: "MP 15560", telefono: "3464 55-0133", direccion: "Buenos Aires 1720", ciudad: "Casilda", horarios: "Jueves de 15 a 20 h", cumple: cumpleEn(210), comentario: "",
        notas: [{ tipo: "visita", fecha: haceDias(20), texto: "Buena recepción. Receta bastante el ácido fólico.", pendiente: false },
                { tipo: "nota", fecha: haceDias(20), texto: "Me pidió muestras de ácido fólico para la próxima.", pendiente: true, hecho: false }] }),
      m({ nombre: "Dr. Martín Ledesma", especialidad: "Cardiología", matricula: "MP 12094", telefono: "341 555-0199", direccion: "Mendoza 3120", ciudad: "Rosario", horarios: "Martes de 10 a 14 h", cumple: cumpleEn(300), comentario: "",
        notas: [{ tipo: "visita", fecha: haceDias(62), texto: "Me dijo que vuelva en dos meses.", pendiente: false }] })
    ];
  }

  var db, guardaOk = true;
  try { var raw = localStorage.getItem(KEY); if (raw) db = JSON.parse(raw); } catch (e) { db = null; }
  if (!db || !Array.isArray(db.medicos)) { db = { medicos: ejemplos() }; guardar(true); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  function guardar(silencio) {
    try { localStorage.setItem(KEY, JSON.stringify(db)); guardaOk = true; }
    catch (e) { guardaOk = false; if (!silencio) toast("No se pudo guardar en este teléfono. Hacé un respaldo."); }
  }
  function buscar(id) { for (var i = 0; i < db.medicos.length; i++) if (db.medicos[i].id === id) return db.medicos[i]; return null; }
  function ultimaVisita(m) { var u = null; (m.notas || []).forEach(function (n) { if (n.tipo === "visita" && (!u || n.fecha > u)) u = n.fecha; }); return u; }
  function pendientes(m) { return (m.notas || []).filter(function (n) { return n.pendiente && !n.hecho; }); }

  /* ---------- estado de la lista ---------- */
  var st = { q: "", esp: "", ciudad: "", flag: "", orden: "nombre" };
  try { var o = localStorage.getItem(KEY + ":orden"); if (o) st.orden = o; } catch (e) {}
  $("#orden").value = st.orden;

  function opciones(campo) {
    var set = {};
    db.medicos.forEach(function (m) { var v = (m[campo] || "").trim(); if (v) set[norm(v)] = set[norm(v)] || v; });
    return Object.keys(set).map(function (k) { return set[k]; }).sort(function (a, b) { return a.localeCompare(b, "es"); });
  }
  function llenarSelect(sel, campo, todos) {
    var vals = opciones(campo), actual = st[sel.id === "f-esp" ? "esp" : "ciudad"];
    sel.innerHTML = '<option value="">' + todos + "</option>" + vals.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + "</option>"; }).join("");
    sel.value = vals.indexOf(actual) >= 0 ? actual : "";
    if (sel.value !== actual) { if (sel.id === "f-esp") st.esp = ""; else st.ciudad = ""; }
  }

  function filtrados() {
    var q = norm(st.q), mesActual = pad(hoy().getMonth() + 1);
    var lista = db.medicos.filter(function (m) {
      if (st.esp && norm(m.especialidad) !== norm(st.esp)) return false;
      if (st.ciudad && norm(m.ciudad) !== norm(st.ciudad)) return false;
      if (st.flag === "pend" && !pendientes(m).length) return false;
      if (st.flag === "cumple" && !(m.cumple && m.cumple.slice(0, 2) === mesActual)) return false;
      if (st.flag === "sinver") { var u = ultimaVisita(m); if (u && diasDesde(u) <= 30) return false; }
      if (q) {
        var txt = norm([m.nombre, m.matricula, m.especialidad, m.direccion, m.ciudad, m.telefono, m.comentario].join(" "));
        var ok = q.split(/\s+/).every(function (p) { return txt.indexOf(p) >= 0; });
        if (!ok) return false;
      }
      return true;
    });
    function sinTitulo(n) { return norm(n).replace(/^(dra?\.?|doctora?)\s+/, ""); }
    lista.sort(function (a, b) {
      if (st.orden === "visita") {
        var ua = ultimaVisita(a) || "0000", ub = ultimaVisita(b) || "0000";
        if (ua !== ub) return ua < ub ? -1 : 1;
      } else if (st.orden === "ciudad") {
        var c = norm(a.ciudad).localeCompare(norm(b.ciudad), "es");
        if (c) return c;
      }
      return sinTitulo(a.nombre).localeCompare(sinTitulo(b.nombre), "es");
    });
    return lista;
  }

  function parseCSV(txt) {
    txt = txt.replace(/^﻿/, "");
    var primera = txt.split(/\r?\n/)[0] || "";
    var sep = (primera.match(/\t/g) || []).length ? "\t" : (primera.match(/;/g) || []).length >= (primera.match(/,/g) || []).length ? ";" : ",";
    var filas = [], fila = [], cel = "", comillas = false;
    for (var i = 0; i < txt.length; i++) {
      var ch = txt[i];
      if (comillas) {
        if (ch === '"') { if (txt[i + 1] === '"') { cel += '"'; i++; } else comillas = false; }
        else cel += ch;
      } else if (ch === '"') comillas = true;
      else if (ch === sep) { fila.push(cel); cel = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && txt[i + 1] === "\n") i++; fila.push(cel); filas.push(fila); fila = []; cel = ""; }
      else cel += ch;
    }
    if (cel || fila.length) { fila.push(cel); filas.push(fila); }
    return filas.filter(function (f) { return f.some(function (c) { return c.trim(); }); });
  }

    v = String(v || "").trim(); var p;
    if ((p = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return pad(+p[2]) + "-" + pad(+p[3]);
    if ((p = v.match(/^(\d{1,2})[\/\-.](\d{1,2})/))) { if (+p[2] >= 1 && +p[2] <= 12 && +p[1] >= 1 && +p[1] <= 31) return pad(+p[2]) + "-" + pad(+p[1]); }
    return "";
  }
  function importarCSV(txt) {
    var filas = parseCSV(txt); if (filas.length < 2) throw new Error("La planilla necesita una fila de títulos y al menos un médico.");
    var cab = filas[0].map(function (h) { return norm(h).replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim(); }), idx = {};
    Object.keys(ALIAS).forEach(function (k) { for (var i = 0; i < cab.length; i++) if (ALIAS[k].indexOf(cab[i]) >= 0) { idx[k] = i; break; } });
    if (idx.nombre == null) throw new Error("No encontré la columna “nombre” en la primera fila.");
    var nuevos = 0, act = 0;
    filas.slice(1).forEach(function (f) {
      var d = {}; Object.keys(idx).forEach(function (k) { d[k] = (f[idx[k]] || "").trim(); });
      if (!d.nombre) return;
      if (d.cumple != null) d.cumple = parseCumple(d.cumple);
      var ex = d.matricula ? db.medicos.filter(function (m) { return norm(m.matricula) === norm(d.matricula); })[0] : null;
      if (ex) { Object.keys(d).forEach(function (k) { if (d[k]) ex[k] = d[k]; }); delete ex.ejemplo; act++; }
      else { var m = { id: uid(), notas: [] }; CAMPOS.forEach(function (k) { m[k] = d[k] || ""; }); db.medicos.push(m); nuevos++; }
    });
    return nuevos + " médicos nuevos" + (act ? " y " + act + " actualizados" : "");
  }
  function importarJSON(txt) {
    var data = JSON.parse(txt), lista = Array.isArray(data) ? data : data.medicos;
    if (!Array.isArray(lista)) throw new Error("Ese archivo no parece un respaldo de esta agenda.");
    var nuevos = 0, act = 0;
    lista.forEach(function (m) {
      if (!m || !m.nombre) return;
      m.id = m.id || uid(); m.notas = Array.isArray(m.notas) ? m.notas : [];
      for (var i = 0; i < db.medicos.length; i++) if (db.medicos[i].id === m.id) { db.medicos[i] = m; act++; return; }
      db.medicos.push(m); nuevos++;
    });
    return nuevos + " médicos nuevos" + (act ? " y " + act + " actualizados" : "");
  }
  function importar(txt) {
    txt = String(txt || "").trim(); if (!txt) { toast("No hay nada para cargar."); return; }
    try {
      var r = /^[\[{]/.test(txt) ? importarJSON(txt) : importarCSV(txt);
      guardar(); renderAjustes(); toast("Listo: " + r);
    } catch (e) { toast(e instanceof SyntaxError ? "El respaldo está incompleto o dañado." : e.message); }
  }

  /* ---------- confirmación de dos toques ---------- */
  function armado(btn, texto) {
    if (btn.dataset.armed === "1") return true;
    var orig = btn.textContent; btn.dataset.armed = "1"; btn.textContent = texto || "Tocá de nuevo para confirmar";
    setTimeout(function () { if (btn.isConnected) { btn.dataset.armed = ""; btn.textContent = orig; } }, 3500);
    return false;
  }

  var tTimer;
  function toast(t) { var el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tTimer); tTimer = setTimeout(function () { el.hidden = true; }, 2600); }

  /* ---------- eventos ---------- */
  $("#q").addEventListener("input", function (e) { st.q = e.target.value; renderLista(); });
  $("#f-esp").addEventListener("change", function (e) { st.esp = e.target.value; renderLista(); });
  $("#f-ciudad").addEventListener("change", function (e) { st.ciudad = e.target.value; renderLista(); });
  $("#orden").addEventListener("change", function (e) { st.orden = e.target.value; try { localStorage.setItem(KEY + ":orden", st.orden); } catch (x) {} renderLista(); });

  document.addEventListener("submit", function (e) { e.preventDefault(); if (e.target.id === "form-medico") guardarMedico(); });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.hecho) { var m = buscar(actual); (m.notas || []).forEach(function (n) { if (n.id === t.dataset.hecho) n.hecho = true; }); guardar(); setTimeout(renderDetalle, 250); toast("Pendiente resuelto"); }
    if (t.id === "archivo" && t.files && t.files[0]) {
      var fr = new FileReader(); fr.onload = function () { importar(fr.result); }; fr.onerror = function () { toast("No se pudo leer el archivo."); };
      fr.readAsText(t.files[0]);
    }
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.open) { actual = d.open; composer.tipo = "visita"; renderDetalle(); abrir("detalle"); return; }
    if (d.flag) { st.flag = st.flag === d.flag ? "" : d.flag; renderLista(); return; }
    if (d.tipo) { composer.tipo = d.tipo; var txt = $("#c-texto").value; renderDetalle(); $("#c-texto").value = txt; return; }
    if (d.toggle) { var m1 = buscar(actual); m1.notas.forEach(function (n) { if (n.id === d.toggle) n.hecho = !n.hecho; }); guardar(); renderDetalle(); return; }
    if (d.borrarNota) { if (!armado(b, "¿borrar?")) return; var m2 = buscar(actual); m2.notas = m2.notas.filter(function (n) { return n.id !== d.borrarNota; }); guardar(); renderDetalle(); toast("Anotación borrada"); return; }
    switch (d.act) {
      case "cerrar": cerrar(); break;
      case "nuevo": editando = null; renderEditor(); abrir("editor"); setTimeout(function () { var n = $("#e-nombre"); if (n) n.focus(); }, 60); break;
      case "editar": editando = actual; renderEditor(); abrir("editor"); break;
      case "guardar-medico": guardarMedico(); break;
      case "anotar": anotar(); break;
      case "borrar-medico":
        if (!armado(b, "Tocá de nuevo para borrar")) return;
        db.medicos = db.medicos.filter(function (m) { return m.id !== editando; }); guardar();
        pila = pila.filter(function (p) { return p !== "detalle"; }); $("#detalle").hidden = true;
        cerrar(); toast("Médico borrado"); break;
      case "respaldo": renderAjustes(); abrir("ajustes"); break;
      case "exp-json": descargar("agenda-medicos-" + hoyISO() + ".json", respaldoJSON(), "application/json"); break;
      case "exp-csv": descargar("agenda-medicos-" + hoyISO() + ".csv", respaldoCSV(), "text/csv;charset=utf-8"); break;
      case "copiar":
        var ta = $("#copia"), txt2 = respaldoJSON(); ta.value = txt2; ta.hidden = false;
        try { navigator.clipboard.writeText(txt2).then(function () { toast("Respaldo copiado. Pegalo en un chat o mail."); }, function () { ta.select(); toast("Seleccioná el texto de abajo y copialo."); }); }
        catch (x) { ta.select(); toast("Seleccioná el texto de abajo y copialo."); }
        break;
      case "importar-texto": importar($("#pegado").value); break;
      case "borrar-ejemplos":
        if (!armado(b, "Tocá de nuevo para borrarlos")) return;
        db.medicos = db.medicos.filter(function (m) { return !m.ejemplo; }); guardar();
        if (pila.length) renderAjustes(); renderLista(); toast("Ejemplos borrados"); break;
      case "borrar-todo":
        if (!armado(b, "Se borra todo. Tocá de nuevo")) return;
        db.medicos = []; guardar(); renderAjustes(); renderLista(); toast("Agenda vacía"); break;
    }
  });

  renderLista();

  // Funciona sin internet cuando está instalada como app (no aplica dentro de la vista previa).
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
